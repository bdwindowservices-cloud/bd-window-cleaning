name: Increase desktop price fonts again

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/increase-desktop-price-fonts-again.yml'

permissions:
  contents: write

jobs:
  increase-price-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase estimate and banner font sizes slightly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_banner = '''        .desktop-action-bar.is-ready #desktop-estimate-main {
          font-size: 0.95rem !important;
          line-height: 1.25;
        }
'''
          new_banner = '''        .desktop-action-bar.is-ready #desktop-estimate-main {
          font-size: 1.05rem !important;
          line-height: 1.25;
        }
'''
          if old_banner not in text:
              raise SystemExit('Expected desktop banner font rule was not found')
          text = text.replace(old_banner, new_banner, 1)

          old_estimate = '''        .quote-total #quote-total-price {
          font-size: 1.15rem !important;
          line-height: 1.25;
        }
'''
          new_estimate = '''        .quote-total #quote-total-price {
          font-size: 1.25rem !important;
          line-height: 1.25;
        }
'''
          if old_estimate not in text:
              raise SystemExit('Expected estimate font rule was not found')
          text = text.replace(old_estimate, new_estimate, 1)

          path.write_text(text)
          PY
      - name: Commit desktop price font changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase desktop price fonts to 1.25rem and 1.05rem"
          git push
