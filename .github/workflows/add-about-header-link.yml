name: Add About header link

# Triggered to add the About navigation item.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-about-header-link.yml'

permissions:
  contents: write

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add About link between Prices and FAQ
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '''        <a href="#quote">Prices</a>
        <a href="#faq">FAQ</a>'''
          new = '''        <a href="#quote">Prices</a>
        <a href="#about">About</a>
        <a href="#faq">FAQ</a>'''
          if old not in text:
              raise SystemExit('Expected Prices and FAQ header links were not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit header link change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add About link to header"
          git push
