name: Fix estimated price font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-estimated-price-font.yml'

permissions:
  contents: write

jobs:
  fix-estimated-price-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce the desktop estimated price text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          override_path = Path('preview-caption-overrides.js')
          override = override_path.read_text()

          old = '''      .desktop-action-bar.is-ready #desktop-estimate-main {
        font-size: 0.82rem;
        line-height: 1.25;
      }
'''
          new = '''      .quote-total #quote-total-price {
        font-size: 1.05rem !important;
        line-height: 1.25;
      }
'''
          if old not in override:
              raise SystemExit('Expected incorrectly targeted desktop font rule was not found')
          override_path.write_text(override.replace(old, new, 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          old_version = 'preview-caption-overrides.js?v=20260801-6'
          new_version = 'preview-caption-overrides.js?v=20260801-7'
          if old_version not in index:
              raise SystemExit('Expected preview script version was not found')
          index_path.write_text(index.replace(old_version, new_version, 1))
          PY
      - name: Commit corrected font target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-caption-overrides.js index.html
          git commit -m "Reduce desktop estimated price font size"
          git push

# Triggered after creation.
