name: Update payment FAQ

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-payment-faq.yml'

permissions:
  contents: write

jobs:
  update-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace price FAQ with payment FAQ
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '<article><h3>How do I get a price?</h3><p>Use the form to get a quick estimate for your property. The price is usually accurate and will be confirmed before cleaning begins.</p></article>'
          new = '<article><h3>How do I pay?</h3><p>We only take payment after you are happy with your estimate and we have finished your first clean. We take card payments, BACS transfers and standing orders.</p></article>'
          if old not in text:
              raise SystemExit('Expected FAQ text was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit FAQ update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace price FAQ with payment information"
          git push

# Triggered after creation.
