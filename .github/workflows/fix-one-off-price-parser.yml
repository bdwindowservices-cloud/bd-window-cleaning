name: Fix one-off price parser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-one-off-price-parser.yml'

permissions:
  contents: write

jobs:
  fix-one-off-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read only the actual price amount
        run: |
          python3 - <<'PY'
          from pathlib import Path

          override_path = Path('preview-caption-overrides.js')
          override = override_path.read_text()
          old = '''  const parseMoney = (text) => {
    const value = Number(String(text).replace(/[^0-9.]/g, ""));
    return Number.isFinite(value) ? value : null;
  };'''
          new = '''  const parseMoney = (text) => {
    const match = String(text).match(/£\\s*(\\d+(?:\\.\\d{1,2})?)/);
    if (!match) return null;

    const value = Number(match[1]);
    return Number.isFinite(value) ? value : null;
  };'''
          if old not in override:
              raise SystemExit('Expected price parser was not found')
          override_path.write_text(override.replace(old, new, 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          old_version = 'preview-caption-overrides.js?v=20260801-3'
          new_version = 'preview-caption-overrides.js?v=20260801-5'
          if old_version not in index:
              raise SystemExit('Expected preview script version was not found')
          index_path.write_text(index.replace(old_version, new_version, 1))
          PY
      - name: Commit one-off price fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-caption-overrides.js index.html
          git commit -m "Fix one-off clean price calculation"
          git push
