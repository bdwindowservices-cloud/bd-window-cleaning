name: Update one-off clean copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-one-off-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update checkbox copy and script version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          text = text.replace('name="Front only clean"', 'name="One-off clean"', 1)
          text = text.replace('Front Only Clean</label>', 'One-off clean £5+</label>', 1)
          text = text.replace('preview-caption-overrides.js?v=20260729-1', 'preview-caption-overrides.js?v=20260801-1', 1)
          path.write_text(text)
          PY
      - name: Commit copy update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update one-off clean checkbox copy"
          git push

# Triggered after creation.
