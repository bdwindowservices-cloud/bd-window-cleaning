name: Force price banner refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-price-banner-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-price-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh scripts and keep mobile price to two lines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          override_path = Path('preview-caption-overrides.js')
          override = override_path.read_text()
          marker = '''      .mobile-action-bar.mobile-banner-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
'''
          addition = marker + '''
      #mobile-quote-amount span,
      #mobile-quote-amount small {
        display: block;
      }

      #mobile-quote-amount span {
        font-size: clamp(0.78rem, 3.7vw, 0.96rem);
        line-height: 1.15;
        white-space: nowrap;
      }
'''
          if '#mobile-quote-amount span {' not in override:
              if marker not in override:
                  raise SystemExit('Expected mobile banner style marker was not found')
              override = override.replace(marker, addition, 1)
              override_path.write_text(override)

          index_path = Path('index.html')
          index = index_path.read_text()
          replacements = {
              'script.js?v=20260801-5': 'script.js?v=20260801-6',
              'preview-caption-overrides.js?v=20260801-3': 'preview-caption-overrides.js?v=20260801-4'
          }
          for old, new in replacements.items():
              if old not in index:
                  raise SystemExit(f'Expected cache version not found: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index)
          PY
      - name: Commit forced refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview-caption-overrides.js
          git commit -m "Force refresh of two-line price banner"
          git push
