name: Add comma to recurring price line

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-recurring-price-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add comma to desktop banner price
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          text = script_path.read_text()
          old = 'hasChangedPrice ? (monthly ? `${price} per clean` : price) : desktopEstimateDefaultMain,'
          new = 'hasChangedPrice ? (monthly ? `${price} per clean,` : price) : desktopEstimateDefaultMain,'
          if old not in text:
              raise SystemExit('Expected desktop recurring price line was not found')
          script_path.write_text(text.replace(old, new, 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          old_version = 'script.js?v=20260801-3'
          new_version = 'script.js?v=20260801-4'
          if old_version not in index:
              raise SystemExit('Expected script cache version was not found')
          index_path.write_text(index.replace(old_version, new_version, 1))
          PY
      - name: Commit punctuation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git commit -m "Match recurring price line wording"
          git push
