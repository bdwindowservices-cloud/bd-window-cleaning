name: Remove Process navigation link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-process-nav.yml'

permissions:
  contents: write

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Process link from header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          target = '        <a href="#process">Process</a>\n'
          if text.count(target) != 1:
              raise SystemExit(f'Expected exactly one Process navigation link, found {text.count(target)}')
          index.write_text(text.replace(target, '', 1))
          Path('.github/workflows/remove-process-nav.yml').unlink()
          PY
      - name: Commit header update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-process-nav.yml
          git commit -m "Remove Process link from header"
          git push
