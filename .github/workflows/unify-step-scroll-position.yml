name: Unify form step scroll positions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-step-scroll-position.yml'

permissions:
  contents: write

jobs:
  update-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use one header-aware scroll position for each form step
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          script = script_path.read_text()

          marker = '''const openBookingDateStep = () => {
'''
          helper = '''const scrollToFormStep = (anchor) => {
  if (!anchor) {
    return;
  }

  requestAnimationFrame(() => {
    const header = document.querySelector(".site-header");
    const headerHeight = header ? header.getBoundingClientRect().height : 0;
    const anchorTop = window.scrollY + anchor.getBoundingClientRect().top;
    const destination = Math.max(0, anchorTop - headerHeight - 18);

    window.scrollTo({ top: destination, behavior: "smooth" });
  });
};

const openBookingDateStep = () => {
'''
          if 'const scrollToFormStep = (anchor) =>' not in script:
              if marker not in script:
                  raise SystemExit('Booking step marker not found')
              script = script.replace(marker, helper, 1)

          old_step_three = '''  setFloatingBookingDatePrompt();
  if (bookingDateStep) {
    bookingDateStep.scrollIntoView({ behavior: "smooth", block: "start" });
  }
};
'''
          new_step_three = '''  setFloatingBookingDatePrompt();
  scrollToFormStep(bookingNextHint || bookingDateStep);
};
'''
          if old_step_three not in script:
              raise SystemExit('Step 3 scroll block not found')
          script = script.replace(old_step_three, new_step_three, 1)

          old_step_two = '''  const stepTwoAnchor = quoteNextHint || quoteDetails;
  if (stepTwoAnchor) {
    requestAnimationFrame(() => {
      const header = document.querySelector(".site-header");
      const headerHeight = header ? header.getBoundingClientRect().height : 0;
      const stepTop = window.scrollY + stepTwoAnchor.getBoundingClientRect().top;
      const destination = Math.max(0, stepTop - headerHeight - 18);

      window.scrollTo({ top: destination, behavior: "smooth" });
    });
  }
};
'''
          new_step_two = '''  scrollToFormStep(quoteNextHint || quoteDetails);
};
'''
          if old_step_two not in script:
              raise SystemExit('Step 2 scroll block not found')
          script = script.replace(old_step_two, new_step_two, 1)

          old_validation = '''      if (bookingDateStep) {
        bookingDateStep.hidden = false;
        bookingDateStep.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      setFloatingBookingDatePrompt();
'''
          new_validation = '''      if (bookingDateStep) {
        bookingDateStep.hidden = false;
      }
      setFloatingBookingDatePrompt();
      scrollToFormStep(bookingNextHint || bookingDateStep);
'''
          if old_validation not in script:
              raise SystemExit('Booking validation scroll block not found')
          script = script.replace(old_validation, new_validation, 1)
          script_path.write_text(script)

          index_path = Path('index.html')
          index = index_path.read_text()
          old_version = 'script.js?v=20260802-1'
          new_version = 'script.js?v=20260802-2'
          if old_version not in index:
              raise SystemExit('Expected script cache version not found')
          index_path.write_text(index.replace(old_version, new_version, 1))
          PY
      - name: Commit unified form scrolling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git commit -m "Align Step 2 and Step 3 scroll positions"
          git push
