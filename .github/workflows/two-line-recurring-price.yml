name: Two-line recurring price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/two-line-recurring-price.yml'

permissions:
  contents: write

jobs:
  update-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put recurring price on two lines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected text not found: {label}')
              return text.replace(old, new, 1)

          script_path = Path('script.js')
          text = script_path.read_text()

          text = replace_once(
              text,
              'mobileQuoteAmount.innerHTML = `<span>${price} per clean,</span><small>every 6–7 weeks<br>Paid as ${monthly}/month</small>`;',
              'mobileQuoteAmount.innerHTML = `<span>${price} per clean - every 6–7 weeks</span><small>Paid as ${monthly}/month</small>`;',
              'mobile banner wording'
          )

          text = replace_once(
              text,
              'hasChangedPrice ? (monthly ? `${price} per clean,` : price) : desktopEstimateDefaultMain,\n    hasChangedPrice ? (monthly ? `every 6–7 weeks<br>Paid as ${monthly}/month` : "We will confirm the price") : desktopEstimateDefaultSub,',
              'hasChangedPrice ? (monthly ? `${price} per clean - every 6–7 weeks` : price) : desktopEstimateDefaultMain,\n    hasChangedPrice ? (monthly ? `Paid as ${monthly}/month` : "We will confirm the price") : desktopEstimateDefaultSub,',
              'desktop banner wording'
          )

          text = replace_once(
              text,
              'quoteTotalPrice.textContent = `${price} per clean,`;\n  }\n  if (quoteTotalMonthly) {\n    quoteTotalMonthly.innerHTML = `every 6–7 weeks<br>Paid as ${monthly}/month`;',
              'quoteTotalPrice.textContent = `${price} per clean - every 6–7 weeks`;\n  }\n  if (quoteTotalMonthly) {\n    quoteTotalMonthly.textContent = `Paid as ${monthly}/month`;',
              'estimated price wording'
          )

          text = replace_once(
              text,
              'estimatedQuoteInput.value = `${price} per clean, every 6–7 weeks, paid as ${monthly}/month`;',
              'estimatedQuoteInput.value = `${price} per clean - every 6–7 weeks; Paid as ${monthly}/month`;',
              'submitted estimate wording'
          )

          script_path.write_text(text)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = replace_once(
              index,
              'script.js?v=20260801-4',
              'script.js?v=20260801-5',
              'script cache version'
          )
          index_path.write_text(index)
          PY
      - name: Commit wording change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          git commit -m "Show recurring price on two lines"
          git push
