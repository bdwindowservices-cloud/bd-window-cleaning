name: Increase desktop price fonts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/increase-desktop-price-fonts.yml'

permissions:
  contents: write

jobs:
  increase-price-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase estimate and banner font sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          override_path = Path('preview-caption-overrides.js')
          override = override_path.read_text()
          old_banner = '''      .desktop-action-bar.is-ready #desktop-estimate-main {
        font-size: 0.82rem;
        line-height: 1.25;
      }
'''
          new_banner = '''      .desktop-action-bar.is-ready #desktop-estimate-main {
        font-size: 0.95rem;
        line-height: 1.25;
      }
'''
          if old_banner not in override:
              raise SystemExit('Expected desktop banner font rule was not found')
          override_path.write_text(override.replace(old_banner, new_banner, 1))

          index_path = Path('index.html')
          index = index_path.read_text()
          old_estimate = '''        .quote-total #quote-total-price {
          font-size: 1.05rem !important;
          line-height: 1.25;
        }
'''
          new_estimate = '''        .quote-total #quote-total-price {
          font-size: 1.15rem !important;
          line-height: 1.25;
        }
'''
          if old_estimate not in index:
              raise SystemExit('Expected estimate font rule was not found')
          index = index.replace(old_estimate, new_estimate, 1)

          old_version = 'preview-caption-overrides.js?v=20260801-6'
          new_version = 'preview-caption-overrides.js?v=20260801-7'
          if old_version not in index:
              raise SystemExit('Expected preview script version was not found')
          index = index.replace(old_version, new_version, 1)
          index_path.write_text(index)
          PY
      - name: Commit desktop price font changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-caption-overrides.js index.html
          git commit -m "Increase desktop price font sizes slightly"
          git push
