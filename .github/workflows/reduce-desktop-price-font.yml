name: Reduce desktop price font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reduce-desktop-price-font.yml'

permissions:
  contents: write

jobs:
  update-desktop-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the desktop recurring price line smaller
        run: |
          python3 - <<'PY'
          from pathlib import Path

          override_path = Path('preview-caption-overrides.js')
          override = override_path.read_text()
          marker = '''      .window-set-preview {
        align-content: center;
        padding-top: 34px;
      }
'''
          addition = marker + '''
      .desktop-action-bar.is-ready #desktop-estimate-main {
        font-size: 0.82rem;
        line-height: 1.25;
      }
'''
          if '.desktop-action-bar.is-ready #desktop-estimate-main' not in override:
              if marker not in override:
                  raise SystemExit('Expected desktop style marker was not found')
              override = override.replace(marker, addition, 1)
              override_path.write_text(override)

          index_path = Path('index.html')
          index = index_path.read_text()
          old = 'preview-caption-overrides.js?v=20260801-3'
          new = 'preview-caption-overrides.js?v=20260801-4'
          if old not in index:
              raise SystemExit('Expected preview override cache version was not found')
          index_path.write_text(index.replace(old, new, 1))
          PY
      - name: Commit desktop price font change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-caption-overrides.js index.html
          git commit -m "Reduce desktop recurring price font size"
          git push
