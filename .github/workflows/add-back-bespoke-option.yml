name: Add back bespoke option

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-back-bespoke-option.yml'

permissions:
  contents: write

jobs:
  update-calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 9+ bespoke back or side option
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text()

          old_back = '''  { label: "5 to 6", emailLabel: "5 to 6 sets", previewSets: 6, price: 11 },
  { label: "7 to 8", emailLabel: "7 to 8 sets", previewSets: 8, price: 14 }
];'''
          new_back = '''  { label: "5 to 6", emailLabel: "5 to 6 sets", previewSets: 6, price: 11 },
  { label: "7 to 8", emailLabel: "7 to 8 sets", previewSets: 8, price: 14 },
  { label: "9+ bespoke", emailLabel: "9+ sets - bespoke quote", previewSets: 0, price: null, bespoke: true }
];'''
          if old_back not in text:
              raise SystemExit('Expected back options block was not found')
          text = text.replace(old_back, new_back, 1)

          old_prompt = '  const isBespoke = getFrontOption().bespoke;'
          new_prompt = '  const isBespoke = Boolean(getFrontOption().bespoke || (!quoteState.frontOnly && getBackOption().bespoke));'
          if old_prompt not in text:
              raise SystemExit('Expected floating prompt bespoke check was not found')
          text = text.replace(old_prompt, new_prompt, 1)

          old_total = '''  const frontOption = getFrontOption();
  const backOption = getBackOption();
  const isBespoke = Boolean(frontOption.bespoke);'''
          new_total = '''  const frontOption = getFrontOption();
  const backOption = getBackOption();
  const isBespoke = Boolean(frontOption.bespoke || (!quoteState.frontOnly && backOption.bespoke));'''
          if old_total not in text:
              raise SystemExit('Expected quote total bespoke check was not found')
          text = text.replace(old_total, new_total, 1)

          old_bespoke = '''  if (isBespoke) {
    if (quoteTotalPrice) {'''
          new_bespoke = '''  if (isBespoke) {
    const bespokeLabels = [];
    if (frontOption.bespoke) {
      bespokeLabels.push(`Front: ${frontOption.emailLabel}`);
    }
    if (!quoteState.frontOnly && backOption.bespoke) {
      bespokeLabels.push(`Back or side: ${backOption.emailLabel}`);
    }

    if (quoteTotalPrice) {'''
          if old_bespoke not in text:
              raise SystemExit('Expected bespoke quote block was not found')
          text = text.replace(old_bespoke, new_bespoke, 1)

          old_estimate = '      estimatedQuoteInput.value = `Bespoke quote (${frontOption.emailLabel})`;'
          new_estimate = '      estimatedQuoteInput.value = `Bespoke quote (${bespokeLabels.join("; ")})`;'
          if old_estimate not in text:
              raise SystemExit('Expected bespoke estimate field was not found')
          text = text.replace(old_estimate, new_estimate, 1)

          path.write_text(text)
          PY
      - name: Commit calculator change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Add 9+ bespoke back or side option"
          git push

# Triggered after creation so GitHub registers and runs the workflow.
