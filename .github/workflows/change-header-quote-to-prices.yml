name: Rename Quote header link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change-header-quote-to-prices.yml'

permissions:
  contents: write

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Quote to Prices in header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '<a href="#quote">Quote</a>'
          new = '<a href="#quote">Prices</a>'
          if old not in text:
              raise SystemExit('Expected Quote header link was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit header text change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename Quote header link to Prices"
          git push
