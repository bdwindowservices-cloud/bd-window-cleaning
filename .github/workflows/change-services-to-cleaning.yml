name: Change Services header label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change-services-to-cleaning.yml'

permissions:
  contents: write

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Services link to Cleaning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '<a href="#services">Services</a>'
          new = '<a href="#services">Cleaning</a>'
          if old not in text:
              raise SystemExit('Expected Services header link was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit header label change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename Services header link to Cleaning"
          git push
# Triggered after workflow creation
