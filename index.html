<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B D Window Cleaning Services has moved</title>
    <meta name="description" content="B D Window Cleaning Services has moved to a new website address.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://bdwindowservices.github.io/">
    <meta http-equiv="refresh" content="2;url=https://bdwindowservices.github.io/">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef8f7;
        color: #172521;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        padding: 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dbe6e2;
        border-radius: 10px;
        box-shadow: 0 18px 44px rgba(21, 42, 36, 0.14);
      }
      .logo {
        width: 92px;
        height: auto;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 12px;
        color: #07575b;
        font-size: clamp(1.75rem, 5vw, 2.3rem);
        line-height: 1.2;
      }
      p {
        margin: 0 0 20px;
        color: #455650;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 8px;
        color: #ffffff;
        background: #0f8b8d;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #172521;
        outline-offset: 3px;
      }
    </style>
    <script>
      window.setTimeout(function () {
        window.location.replace("https://bdwindowservices.github.io/");
      }, 1200);
    </script>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/bd-header-logo.svg" alt="B D Window Cleaning Services logo">
      <h1>Our website has moved</h1>
      <p>You are being taken to the new B D Window Cleaning Services website.</p>
      <a href="https://bdwindowservices.github.io/">Continue to the new website</a>
    </main>
  </body>
</html>
